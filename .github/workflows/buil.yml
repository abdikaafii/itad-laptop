name: Build ITAD ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build xorriso isolinux syslinux syslinux-common \
            syslinux-utils squashfs-tools dosfstools mtools \
            grub-efi-amd64-bin grub-pc-bin

      - name: Patch live-build for start-stop-daemon bug
        run: |
          sudo sed -i '/# begin-remove-after: released:forky/,/# end-remove-after/d' /usr/lib/live/build/lb_chroot_dpkg

      - name: Configure Live Build
        run: |
          cd build
          sudo lb config \
            --distribution jammy \
            --parent-distribution jammy \
            --archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap http://archive.ubuntu.com/ubuntu \
            --mirror-chroot http://archive.ubuntu.com/ubuntu \
            --mirror-binary http://archive.ubuntu.com/ubuntu \
            --memtest none \
            --syslinux-theme "live-build" \
            --bootloader "syslinux" \
            --bootappend-live "boot=live components quiet splash"

      - name: DIAGNOSTIC - locate isolinux files
        run: |
          echo "=== syslinux package files ==="
          dpkg -L syslinux 2>/dev/null | grep -E "(isolinux|ldlinux|vesamenu)" || true
          echo "=== syslinux-common package files ==="
          dpkg -L syslinux-common 2>/dev/null | grep -E "(isolinux|ldlinux|vesamenu)" || true
          echo "=== isolinux package files ==="
          dpkg -L isolinux 2>/dev/null | grep -E "(isolinux|ldlinux|vesamenu)" || true
          echo "=== find on disk ==="
          sudo find /usr -name "isolinux.bin" 2>/dev/null || echo "isolinux.bin NOT FOUND anywhere under /usr"
          sudo find /usr -name "vesamenu.c32" 2>/dev/null || echo "vesamenu.c32 NOT FOUND anywhere under /usr"
          sudo find /usr -name "ldlinux.c32" 2>/dev/null || echo "ldlinux.c32 NOT FOUND anywhere under /usr"

      - name: Fix isolinux paths (AFTER lb config)
        run: |
          set -e
          sudo mkdir -p /root/isolinux

          ISOLINUX=$(sudo find /usr -name "isolinux.bin" 2>/dev/null | head -1)
          VESAMENU=$(sudo find /usr -name "vesamenu.c32" 2>/dev/null | head -1)
          LDLINUX=$(sudo find /usr -name "ldlinux.c32" 2>/dev/null | head -1)

          echo "Found isolinux.bin at:  ${ISOLINUX:-<none>}"
          echo "Found vesamenu.c32 at:  ${VESAMENU:-<none>}"
          echo "Found ldlinux.c32 at:  ${LDLINUX:-<none>}"

          [ -n "$ISOLINUX" ] || { echo "FATAL: isolinux.bin not found on this runner"; exit 1; }
          [ -n "$VESAMENU" ] || { echo "FATAL: vesamenu.c32 not found on this runner"; exit 1; }
          [ -n "$LDLINUX" ] || { echo "FATAL: ldlinux.c32 not found on this runner"; exit 1; }

          sudo cp "$ISOLINUX" /root/isolinux/isolinux.bin
          sudo cp "$VESAMENU" /root/isolinux/vesamenu.c32
          sudo cp "$LDLINUX" /root/isolinux/ldlinux.c32

          echo "=== Contents of /root/isolinux/ ==="
          sudo ls -la /root/isolinux/

      - name: Build ISO
        run: |
          cd build
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ITAD-Live-ISO
          path: build/*.iso
          retention-days: 5