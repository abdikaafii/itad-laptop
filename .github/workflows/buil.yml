name: Build ITAD ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build xorriso isolinux syslinux syslinux-common \
            syslinux-utils squashfs-tools dosfstools mtools \
            grub-efi-amd64-bin grub-pc-bin file

      - name: Patch live-build for start-stop-daemon bug
        run: |
          sudo sed -i '/# begin-remove-after: released:forky/,/# end-remove-after/d' /usr/lib/live/build/lb_chroot_dpkg

      - name: Configure Live Build
        run: |
          cd build
          sudo lb config \
            --distribution jammy \
            --parent-distribution jammy \
            --archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap http://archive.ubuntu.com/ubuntu \
            --mirror-chroot http://archive.ubuntu.com/ubuntu \
            --mirror-binary http://archive.ubuntu.com/ubuntu \
            --memtest none \
            --syslinux-theme "live-build" \
            --bootloader "syslinux" \
            --bootappend-live "boot=live components quiet splash"

      - name: Fix isolinux paths with real files
        run: |
          set -e
          sudo mkdir -p /root/isolinux

          ISO=$(sudo find /usr -type f -name "isolinux.bin" 2>/dev/null | head -1)
          VES=$(sudo find /usr -type f -name "vesamenu.c32" 2>/dev/null | head -1)
          LDL=$(sudo find /usr -type f -name "ldlinux.c32"  2>/dev/null | head -1)

          echo "Direct-file search:"
          echo "  isolinux.bin = ${ISO:-<not found>}"
          echo "  vesamenu.c32 = ${VES:-<not found>}"
          echo "  ldlinux.c32  = ${LDL:-<not found>}"

          if [ -z "$ISO" ] || [ -z "$VES" ] || [ -z "$LDL" ]; then
            echo "Some files missing — extracting from .deb packages..."
            mkdir -p /tmp/iso-work && cd /tmp/iso-work
            apt-get download isolinux syslinux-common
            mkdir -p extracted
            for d in isolinux_*.deb syslinux-common_*.deb; do
              echo "  extracting $d"
              dpkg-deb -x "$d" extracted
            done
            [ -n "$ISO" ] || ISO=$(find extracted -type f -name "isolinux.bin"  | head -1)
            [ -n "$VES" ] || VES=$(find extracted -type f -name "vesamenu.c32"  | head -1)
            [ -n "$LDL" ] || LDL=$(find extracted -type f -name "ldlinux.c32"  | head -1)
            echo "After .deb extraction:"
            echo "  isolinux.bin = ${ISO:-<still missing>}"
            echo "  vesamenu.c32 = ${VES:-<still missing>}"
            echo "  ldlinux.c32  = ${LDL:-<still missing>}"
          fi

          [ -n "$ISO" ] || { echo "FATAL: no real isolinux.bin found"; exit 1; }
          [ -n "$VES" ] || { echo "FATAL: no real vesamenu.c32 found"; exit 1; }
          [ -n "$LDL" ] || { echo "FATAL: no real ldlinux.c32 found"; exit 1; }

          sudo cp "$ISO" /root/isolinux/isolinux.bin
          sudo cp "$VES" /root/isolinux/vesamenu.c32
          sudo cp "$LDL" /root/isolinux/ldlinux.c32

          echo "=== /root/isolinux/ contents ==="
          sudo ls -la /root/isolinux/

      - name: Build ISO
        run: |
          cd build
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ITAD-Live-ISO
          path: build/*.iso
          retention-days: 5