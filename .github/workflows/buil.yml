name: Build ITAD Laptop ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Write build script
        run: |
          cat > build-iso.sh <<'EOF'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools \
            syslinux syslinux-common isolinux mtools dosfstools \
            grub-pc-bin grub-efi-amd64-bin ca-certificates cpio zstd gnupg \
            imagemagick fonts-dejavu-core
          cd /work/build
          bash build.sh 2>&1 | tee build.log
          EOF

      - name: Build ISO (Debian 12 container)
        run: |
          docker run --rm --privileged -v "$PWD":/work debian:bookworm bash /work/build-iso.sh

      - name: Fix file owner and make checksum
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" build || true
          cd build && sha256sum itad-laptop.iso > itad-laptop.iso.sha256 || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ITAD-Laptop-ISO
          path: |
            build/itad-laptop.iso
            build/itad-laptop.iso.sha256
          retention-days: 5

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 5
