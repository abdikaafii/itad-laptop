name: Build ITAD ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build xorriso isolinux syslinux syslinux-common \
            syslinux-utils squashfs-tools dosfstools mtools \
            grub-efi-amd64-bin grub-pc-bin

      - name: Verify isolinux files exist
        run: |
          ls -la /usr/lib/ISOLINUX/isolinux.bin
          ls -la /usr/lib/syslinux/modules/bios/vesamenu.c32
          ls -la /usr/lib/syslinux/modules/bios/ldlinux.c32

      - name: Configure Live Build
        run: |
          cd build
          sudo lb config \
            --distribution jammy \
            --archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap http://archive.ubuntu.com/ubuntu \
            --mirror-chroot http://archive.ubuntu.com/ubuntu \
            --mirror-binary http://archive.ubuntu.com/ubuntu \
            --memtest none \
            --syslinux-theme "live-build" \
            --bootloader "syslinux" \
            --bootappend-live "boot=live components quiet splash"

      - name: Build ISO
        run: |
          set -o pipefail
          cd build
          sudo lb build 2>&1 | tee build.log

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ITAD-Live-ISO
          path: build/*.iso
          retention-days: 5

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 5
