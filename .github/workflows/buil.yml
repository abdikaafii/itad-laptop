name: Build ITAD ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build xorriso isolinux syslinux syslinux-common \
            syslinux-utils squashfs-tools dosfstools mtools \
            grub-efi-amd64-bin grub-pc-bin

      - name: Verify isolinux files exist (should pass on focal)
        run: |
          ls -la /usr/lib/ISOLINUX/isolinux.bin
          ls -la /usr/lib/syslinux/modules/bios/vesamenu.c32
          ls -la /usr/lib/syslinux/modules/bios/ldlinux.c32

      - name: Configure Live Build
        run: |
          cd build
          sudo lb config \
            --distribution jammy \
            --archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap http://archive.ubuntu.com/ubuntu \
            --mirror-chroot http://archive.ubuntu.com/ubuntu \
            --mirror-binary http://archive.ubuntu.com/ubuntu \
            --memtest none \
            --syslinux-theme "live-build" \
            --bootloader "syslinux" \
            --bootappend-live "boot=live components quiet splash"

      - name: Build ISO
        run: |
          cd build
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ITAD-Live-ISO
          path: build/*.iso
          retention-days: 5