name: Build ITAD ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso isolinux syslinux-common squashfs-tools dosfstools mtools

      - name: Patch live-build for start-stop-daemon bug
        run: |
          sudo sed -i '/# begin-remove-after: released:forky/,/# end-remove-after/d' /usr/lib/live/build/lb_chroot_dpkg

      - name: Configure Live Build
        run: |
          cd build
          sudo lb config \
            --distribution jammy \
            --parent-distribution jammy \
            --archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap http://archive.ubuntu.com/ubuntu \
            --mirror-chroot http://archive.ubuntu.com/ubuntu \
            --mirror-binary http://archive.ubuntu.com/ubuntu \
            --memtest none \
            --syslinux-theme "live-build"

      - name: Build ISO
        run: |
          cd build
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ITAD-Live-ISO
          path: build/*.iso
          retention-days: 5