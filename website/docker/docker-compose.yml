# Run from the website/ folder:  docker compose -f docker/docker-compose.yml --env-file .env up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itad
      POSTGRES_DB: itad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itad"]
      interval: 5s
      retries: 10
  app:
    build: { context: .., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: ../.env
    ports: ["8000:8000"]
    volumes: [appdata:/data]
volumes: { dbdata: {}, appdata: {} }
